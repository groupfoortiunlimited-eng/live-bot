name: Live
on:
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install
        run: sudo apt update && sudo apt install -y ffmpeg python3-pip && pip3 install -U gdown
      - name: Download Video
        run: gdown --fuzzy "https://drive.google.com/file/d/1pX4_D7vZk6kVwYrsVQv20hKT2CXOwCRi/view?usp=drivesdk" -O video.mp4
      - name: Download Audio
        run: gdown --fuzzy "https://drive.google.com/file/d/1YTFZJWZ93aUj8jZNv05yyZGrbfbLMcSe/view?usp=drivesdk" -O audio.mp3
      - name: Go Live
        run: ffmpeg -re -stream_loop -1 -i video.mp4 -stream_loop -1 -i audio.mp3 -map 0:v:0 -map 1:a:0 -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 20 -c:v libx264 -preset veryfast -maxrate 1500k -bufsize 3000k -pix_fmt yuv420p -g 40 -c:a aac -b:a 128k -ar 44100 -t 21000 -f flv rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}
