name: Live on
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install
        run: sudo apt update && sudo apt install -y ffmpeg python3-pip && pip3 install -U gdown

      - name: Download Video
        run: gdown "1KD3WVphOgYR0P6YAfvPXD73Gei5M5W1c" -O video.mp4

      - name: Check Files
        run: |
          ls -lh
          ffprobe video.mp4

      - name: Go Live
        run: ffmpeg -re -stream_loop -1 -i video.mp4 -map 0:v:0 -map 0:a:0 -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,setsar=1" -r 30 -c:v libx264 -preset veryfast -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -t 21000 -f flv rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}
